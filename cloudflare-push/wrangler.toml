name = "mytraining-push"
main = "src/index.js"
compatibility_date = "2026-11-06"

# Von 06/07 Uhr UTC nur an Mo/Mi/Fr; Europe/Berlin wechselt Sommer-/Winterzeit.
[triggers]
crons = ["0 6,7 * * 1,3,5"]

[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "HIER_DEINE_KV_NAMESPACE_ID_EINTRAGEN"

[vars]
ALLOWED_ORIGIN = "https://tsoliman23.github.io"
VAPID_SUBJECT = "mailto:DEINE_EMAIL_ADRESSE_HIER"
VAPID_SERVER_PUBLIC_KEY = "HIER_DEN_GENERIERTEN_PUBLIC_KEY_EINTRAGEN"
# VAPID_SERVER_PRIVATE_KEY via: npx wrangler secret put VAPID_SERVER_PRIVATE_KEY
